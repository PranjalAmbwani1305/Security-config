[alembic]
script_location = migrations
# The database URL is NOT configured here. migrations/env.py reads DATABASE_URL
# from the environment so the same migrations run locally and in AWS.
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
