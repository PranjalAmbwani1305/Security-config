# Local development stack: PostgreSQL (with pgvector) + API.
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.cli seed-library"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # restricted role (no superuser / BYPASSRLS) so row-level security is enforced
      DATABASE_URL: postgresql+psycopg://sentinel_app:sentinel_app@db:5432/sentinel
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  dbdata:
